<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Surat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        
        .iframe-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: white;
        }
        
        #appFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        /* 🔥 Responsif dengan scale */
        @media (max-width: 768px) {
            #appFrame {
                transform: scale(0.85);
                transform-origin: top left;
                width: 117.64%;
                height: 117.64%;
            }
        }
        
        @media (max-width: 480px) {
            #appFrame {
                transform: scale(0.7);
                transform-origin: top left;
                width: 142.85%;
                height: 142.85%;
            }
        }
        
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 9999;
        }
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div>Memuat Aplikasi...</div>
    </div>
    
    <div class="iframe-wrapper">
        <iframe 
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbwo09sv01M3LVbOmf23zIxqPzOlEeWOgiO8zbCOIE90Swy-v0janeXQmtN_kIPRAALk/exec?mobile=true"
            sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-top-navigation"
            allow="geolocation; microphone; camera; midi; encrypted-media"
            loading="lazy"
            scrolling="yes"
        ></iframe>
    </div>

    <script>
        const iframe = document.getElementById('appFrame');
        const loader = document.getElementById('loader');
        
        iframe.addEventListener('load', function() {
            loader.style.display = 'none';
            forceMobileView();
        });
        
        setTimeout(() => {
            loader.style.display = 'none';
        }, 5000);
        
        // 🔥 FORCE MOBILE VIEW
        function forceMobileView() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (iframeDoc) {
                    // Force viewport
                    let viewport = iframeDoc.querySelector('meta[name="viewport"]');
                    if (viewport) {
                        viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
                    } else {
                        const meta = iframeDoc.createElement('meta');
                        meta.name = 'viewport';
                        meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
                        iframeDoc.head.appendChild(meta);
                    }
                    
                    // Tambahkan CSS
                    const style = iframeDoc.createElement('style');
                    style.textContent = `
                        html { zoom: 1 !important; transform: scale(1) !important; }
                        body { 
                            overflow-x: hidden !important;
                            width: 100% !important;
                            margin: 0 !important;
                            padding: 10px !important;
                        }
                        .container, .main, .content, [class*="container"], [class*="main"] {
                            max-width: 100% !important;
                            padding-left: 10px !important;
                            padding-right: 10px !important;
                        }
                        table { 
                            width: 100% !important; 
                            display: block !important;
                            overflow-x: auto !important;
                        }
                        img { max-width: 100% !important; height: auto !important; }
                        input, select, textarea { 
                            max-width: 100% !important;
                            box-sizing: border-box !important;
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                    console.log('✅ Mobile view dipaksa');
                }
            } catch (e) {
                console.log('⚠️ Tidak bisa akses iframe:', e.message);
            }
        }
        
        // 🔥 Resize handler
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const width = window.innerWidth;
                const wrapper = document.querySelector('.iframe-wrapper');
                
                if (width <= 480) {
                    wrapper.style.transform = 'scale(0.7)';
                    wrapper.style.transformOrigin = 'top left';
                    wrapper.style.width = '142.85%';
                    wrapper.style.height = '142.85%';
                } else if (width <= 768) {
                    wrapper.style.transform = 'scale(0.85)';
                    wrapper.style.transformOrigin = 'top left';
                    wrapper.style.width = '117.64%';
                    wrapper.style.height = '117.64%';
                } else {
                    wrapper.style.transform = 'scale(1)';
                    wrapper.style.transformOrigin = 'top left';
                    wrapper.style.width = '100%';
                    wrapper.style.height = '100%';
                }
            }, 300);
        });
        
        // Panggil pertama kali
        setTimeout(() => {
            window.dispatchEvent(new Event('resize'));
        }, 100);
    </script>
</body>
</html>
