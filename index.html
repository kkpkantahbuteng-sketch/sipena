<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Apps Script</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            /* 🔥 Kunci perbaikan: Atur ukuran iframe agar sesuai */
            min-width: 320px;
            min-height: 480px;
        }
        /* 🔥 Perbaikan untuk layar kecil */
        @media (max-width: 768px) {
            iframe {
                width: 100vw;
                height: 100vh;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbwo09sv01M3LVbOmf23zIxqPzOlEeWOgiO8zbCOIE90Swy-v0janeXQmtN_kIPRAALk/exec"></iframe>
</body>
</html>
